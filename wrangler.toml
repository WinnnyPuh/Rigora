# Works as a Cloudflare Worker (Workers & Pages → Create → Import a repository).
# A Pages project connected to this repo also works: Pages ignores this file
# and uses the dashboard settings (output directory "public") plus ./functions.
name = "rigora"
main = "src/worker.js"
compatibility_date = "2025-09-01"
# keep variables added in the Cloudflare dashboard when a new version deploys
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
